<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>morse</title>

    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>
</head>
<body>
    
    <div class="w-full h-full flex flex-col justify-between p-12">
        <span data-notebook class="text-center text-2xl font-semibold block h-8"></span>

        <div class="flex flex-col items-center gap-4">
            <span class="block w-full text-left underline">Dependent System</span>
            <span data-d-state class="block h-6"></span>
            <div class="flex gap-2">
                <button data-d-short class="px-5 py-2 bg-gray-200 rounded-md cursor-pointer shadow-md active:shadow-none disabled:opacity-50">Short</button>
                <button data-d-long class="px-5 py-2 bg-gray-200 rounded-md cursor-pointer shadow-md active:shadow-none disabled:opacity-50">Long</button>
            </div>
            <div class="flex gap-2">
                <button data-d-reset class="px-5 py-2 bg-gray-200 rounded-md cursor-pointer shadow-md active:shadow-none disabled:opacity-50">Reset</button>
                <button data-d-submit class="px-5 py-2 bg-gray-200 rounded-md cursor-pointer shadow-md active:shadow-none disabled:opacity-50">Submit</button>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <span class="block w-full text-left underline">Independent System</span>
            <span data-i-state class="block h-6"></span>
            <div class="flex gap-2">
                <button data-i-short class="px-5 py-2 bg-gray-200 rounded-md cursor-pointer shadow-md active:shadow-none disabled:opacity-50">Short</button>
                <button data-i-long class="px-5 py-2 bg-gray-200 rounded-md cursor-pointer shadow-md active:shadow-none disabled:opacity-50">Long</button>
            </div>
            <div class="flex gap-2">
                <button data-i-reset class="px-5 py-2 bg-gray-200 rounded-md cursor-pointer shadow-md active:shadow-none disabled:opacity-50">Reset</button>
                <button data-i-submit class="px-5 py-2 bg-gray-200 rounded-md cursor-pointer shadow-md active:shadow-none disabled:opacity-50">Submit</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="dependent.js"></script>
    <script src="independent.js"></script>
</body>
</html>
